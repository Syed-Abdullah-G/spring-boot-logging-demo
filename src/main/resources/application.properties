spring.application.name=logging-demo
server.port=8080

# ---------------------------------------------------------------
# Log levels (TRACE < DEBUG < INFO < WARN < ERROR)
# ---------------------------------------------------------------
# Everything defaults to INFO...
logging.level.root=INFO
# ...but our own code logs DEBUG and above.
logging.level.com.example.loggingdemo=DEBUG
# Framework noise stays quiet. Change to DEBUG to see how Spring MVC handles requests.
logging.level.org.springframework.web=INFO

# ---------------------------------------------------------------
# File logging: written to logs/application.log (relative to where the app is started)
# ---------------------------------------------------------------
logging.file.name=logs/application.log
# Roll the file over at 10MB, keep 7 days of history and at most 100MB of archives.
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7
logging.logback.rollingpolicy.total-size-cap=100MB

# ---------------------------------------------------------------
# Log formats. %X{requestId} is filled in by RequestLoggingFilter via the MDC.
# ---------------------------------------------------------------
logging.pattern.console=%d{HH:mm:ss.SSS} %clr(%-5level) [%X{requestId:-no-request}] %clr(%logger{30}){cyan} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [%X{requestId:-no-request}] %logger{40} - %msg%n
